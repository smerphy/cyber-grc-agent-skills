name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    name: Validate skills and links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run validator
        run: python3 scripts/validate_skills.py
